server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale JS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Same-origin proxy to the API. This is what keeps the session cookie a
    # first-party SameSite=Lax cookie instead of a cross-site one.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Campaign uploads can take a moment; do not cut them short.
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # BullMQ dashboard and health probes live outside /api.
    location /admin/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # SPA fallback: client-side routes like /dashboard must return index.html
    # rather than a 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
